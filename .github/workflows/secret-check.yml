name: secret-check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  secret-scanning-gate:
    name: Secret scanning gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail if hardcoded secrets are detected
        env:
          GH_TOKEN: ${{ secrets.SECRET_SCAN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Secret check not configured::SECRET_SCAN_TOKEN is missing, so secrets cannot be checked. Failing closed."
            exit 1
          fi

          # secret scanning runs asynchronously after a push
          sleep 30

          found=0
          for n in $(gh api --paginate "repos/$REPO/secret-scanning/alerts?state=open&per_page=100" --jq '.[].number'); do
            found=1
            type=$(gh api "repos/$REPO/secret-scanning/alerts/$n" --jq '.secret_type_display_name')
            url=$(gh api "repos/$REPO/secret-scanning/alerts/$n" --jq '.html_url')

            gh api "repos/$REPO/secret-scanning/alerts/$n/locations" \
              --jq '.[] | select(.type=="commit") | "\(.details.path)\t\(.details.start_line)"' |
            while IFS=$'\t' read -r path line; do
              echo "::error file=${path},line=${line},title=Hardcoded secret detected::${type} is hardcoded in ${path} at line ${line}. Remove it, rotate the credential, then push again."
              echo "- ❌ **${type}** hardcoded in \`${path}\` at line ${line} ([alert #${n}](${url}))" >> "$GITHUB_STEP_SUMMARY"
            done
          done

          if [ "$found" -eq 1 ]; then
            echo "## ❌ Security check did not pass: hardcoded secrets found" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Security check FAILED::Hardcoded secrets were detected. See the annotations and run summary for file and line."
            exit 1
          fi

          echo "✅ No open secret scanning alerts"
          echo "## ✅ Secret check passed" >> "$GITHUB_STEP_SUMMARY"
