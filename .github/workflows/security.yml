name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions: {}

jobs:
  codeql:
    name: CodeQL scan + gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:${{ matrix.language }}"

      - name: Gate - fail if high/critical findings exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          LANG_CAT: "/language:${{ matrix.language }}"
        run: |
          findings=$(gh api --paginate \
            "repos/${REPO}/code-scanning/alerts?state=open&ref=${REF}&tool_name=CodeQL" \
            --jq ".[]
              | select(.most_recent_instance.category == \"${LANG_CAT}\")
              | select(.rule.security_severity_level==\"high\" or .rule.security_severity_level==\"critical\" or .rule.severity==\"error\")
              | \"- [\(.rule.security_severity_level // .rule.severity)] \(.rule.id): \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line) -> \(.html_url)\"")

          if [ -n "$findings" ]; then
            echo "::error title=Security check FAILED::CodeQL (${{ matrix.language }}) found high/critical issues. Details below."
            echo "$findings"
            {
              echo "## ❌ Security check did not pass (${{ matrix.language }})"
              echo "CodeQL found the following issues:"
              echo ""
              echo "$findings"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ No high/critical CodeQL findings"
          echo "## ✅ CodeQL (${{ matrix.language }}) passed" >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
